<svg width="780" height="330" viewBox="0 0 780 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eesher Janda terminal profile</title>
  <desc id="desc">Animated terminal introducing Eesher as a software engineer focused on reliable distributed systems.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="780" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F81F7"/>
      <stop offset="0.55" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#010409" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 16px; }
      .muted { fill: #8B949E; }
      .prompt { fill: #79C0FF; font-weight: 700; }
      .value { fill: #C9D1D9; }
      .accent { fill: #7EE787; }
      .purple { fill: #D2A8FF; }
      .line { opacity: 0; animation: reveal 0.35s ease-out forwards; }
      .l1 { animation-delay: 0.25s; }
      .l2 { animation-delay: 0.75s; }
      .l3 { animation-delay: 1.25s; }
      .l4 { animation-delay: 1.75s; }
      .l5 { animation-delay: 2.25s; }
      .l6 { animation-delay: 2.75s; }
      .l7 { animation-delay: 3.25s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .line { opacity: 1; animation: none; } .cursor { animation: none; } }
    </style>
  </defs>

  <rect x="2" y="2" width="776" height="326" rx="14" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="772" height="322" rx="12" fill="#0D1117"/>
  <path d="M4 16C4 9.373 9.373 4 16 4H764C770.627 4 776 9.373 776 16V42H4V16Z" fill="#161B22"/>
  <circle cx="24" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="23" r="6" fill="#27C93F"/>
  <text x="390" y="28" text-anchor="middle" class="mono muted" font-size="13">eesher@engineering: ~/profile</text>

  <g class="line l1">
    <text x="28" y="76" class="mono prompt">$</text>
    <text x="50" y="76" class="mono value">whoami --verbose</text>
  </g>
  <g class="line l2">
    <text x="28" y="106" class="mono accent">Eesher Janda</text>
    <text x="173" y="106" class="mono muted">// Computer Science @ University of Guelph</text>
  </g>
  <g class="line l3">
    <text x="28" y="146" class="mono prompt">$</text>
    <text x="50" y="146" class="mono value">./focus --current</text>
  </g>
  <g class="line l4">
    <text x="28" y="176" class="mono purple">software engineering</text>
    <text x="238" y="176" class="mono muted">|</text>
    <text x="258" y="176" class="mono purple">distributed systems</text>
    <text x="466" y="176" class="mono muted">|</text>
    <text x="486" y="176" class="mono purple">developer infrastructure</text>
  </g>
  <g class="line l5">
    <text x="28" y="216" class="mono prompt">$</text>
    <text x="50" y="216" class="mono value">verify --projects TriageCI RaftKV SyncLab</text>
  </g>
  <g class="line l6">
    <text x="28" y="246" class="mono accent">PASS</text>
    <text x="78" y="246" class="mono muted">tests green | faults injected | claims reproducible</text>
  </g>
  <g class="line l7">
    <text x="28" y="286" class="mono prompt">$</text>
    <rect x="50" y="270" width="10" height="20" rx="1" fill="#C9D1D9" class="cursor"/>
  </g>
</svg>
